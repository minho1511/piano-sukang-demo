<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>피아노 학원 수강관리 (데모)</title>
<style>
  :root{--bg:#f5f5fa;--card:#fff;--ink:#1c2330;--sub:#6b7488;--line:#e9e9f2;--pri:#7c5cfc;--pri-d:#6a49ea;--ok:#18a566;--warn:#e6892e;--danger:#e2495a;--hold:#a07be8;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
  .wrap{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:76px}
  .top{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line);padding:13px 16px;display:flex;align-items:center;justify-content:space-between}
  .top h1{font-size:16px;font-weight:700}
  .top .who{font-size:12px;color:var(--sub)}
  .who b{color:var(--pri)}
  .btn{border:0;border-radius:10px;padding:11px 14px;font-size:14px;font-weight:600;cursor:pointer;background:var(--pri);color:#fff}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:#eef0f7;color:var(--ink)}
  .btn.sm{padding:7px 11px;font-size:13px;border-radius:8px}
  .btn.ok{background:var(--ok)}.btn.warn{background:var(--warn)}.btn.hold{background:var(--hold)}.btn.danger{background:var(--danger)}
  .pad{padding:14px 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .row{display:flex;align-items:center;gap:10px}
  .between{justify-content:space-between}
  .stu-name{font-weight:700;font-size:16px}
  .tag{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:600}
  .tag.t{background:#eef0ff;color:var(--pri-d)}
  .tag.hold{background:#f0e9fb;color:var(--hold)}
  .tag.warnb{background:#fdf0e2;color:var(--warn)}
  .tag.expb{background:#fdeaed;color:var(--danger)}
  .sub{color:var(--sub);font-size:13px}
  .big{font-size:26px;font-weight:800;letter-spacing:-.5px}
  .big small{font-size:14px;font-weight:600;color:var(--sub)}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
  .kpi .n{font-size:22px;font-weight:800}
  .kpi .l{font-size:11px;color:var(--sub);margin-top:2px}
  .tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:20}
  .tabbar button{flex:1;border:0;background:none;padding:10px 0 12px;font-size:11px;color:var(--sub);cursor:pointer}
  .tabbar button.on{color:var(--pri);font-weight:700}
  .tabbar .ic{display:block;font-size:19px;margin-bottom:2px}
  .search{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:var(--card)}
  .hello{padding:2px 2px 12px}.hello{font-size:18px;font-weight:800}.hello .mini{font-weight:500;margin-top:3px}
  .ftabs{display:flex;gap:6px;margin:12px 0 10px}
  .ftab{flex:1;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:9px 0;font-size:13px;font-weight:600;color:var(--sub);cursor:pointer}
  .ftab.on{background:var(--pri);color:#fff;border-color:var(--pri)}
  .center{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px}
  .login-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 20px;width:100%;box-shadow:0 8px 30px rgba(30,40,90,.06)}
  .login-card h2{font-size:19px;margin-bottom:4px}
  .who-pick{display:flex;flex-direction:column;gap:10px;margin-top:16px}
  .who-pick button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:14px;text-align:left;cursor:pointer;font-size:14px}
  .who-pick button b{display:block;font-size:15px}
  .who-pick button:active{border-color:var(--pri)}
  .toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:#1c2330;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:50;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
  .toast.show{opacity:.96}
  .mini{font-size:12px;color:var(--sub)}
  .barwrap{height:7px;background:#eef0f7;border-radius:99px;overflow:hidden;margin-top:8px}
  .bar{height:100%;background:var(--pri);border-radius:99px}
  .modal-bg{position:fixed;inset:0;background:rgba(20,26,40,.45);display:none;align-items:flex-end;justify-content:center;z-index:40}
  .modal-bg.show{display:flex}
  .sheet{background:var(--card);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:18px 16px 26px}
  .sheet h3{font-size:17px;margin-bottom:2px}
  .lesson-log{margin-top:10px;max-height:150px;overflow:auto}
  .logline{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);padding:5px 0;border-bottom:1px dashed var(--line)}
  .demo-badge{background:#fff6e5;color:#a56a15;font-size:11px;text-align:center;padding:5px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<div class="modal-bg" id="modalBg"><div class="sheet" id="sheet"></div></div>

<script>
// ── 데모 데이터 (실배포 시 원장 Firebase/Supabase로 대체) ─────────────
const KEY='piano_demo_v1';
function seed(){
  const today=new Date('2026-08-20');
  const d=(off)=>{const x=new Date(today);x.setDate(x.getDate()+off);return x.toISOString().slice(0,10);};
  return {
    teachers:[{id:'t1',name:'김선생'},{id:'t2',name:'이선생'}],
    students:[
      {id:'s1',name:'박서준',phone:'010-1234-5678',teacher:'t1',plan:'3개월',total:24,used:9,start:d(-40),end:d(50),hold:false,holdDays:0,log:[]},
      {id:'s2',name:'최지우',phone:'010-2222-3333',teacher:'t1',plan:'1개월',total:8,used:7,start:d(-20),end:d(10),hold:false,holdDays:0,log:[]},
      {id:'s3',name:'정민서',phone:'010-4444-5555',teacher:'t2',plan:'6개월',total:48,used:12,start:d(-60),end:d(120),hold:true,holdDays:7,start2:null,log:[]},
      {id:'s4',name:'강하윤',phone:'010-6666-7777',teacher:'t2',plan:'3개월',total:24,used:23,start:d(-70),end:d(6),hold:false,holdDays:0,log:[]},
      {id:'s5',name:'윤도현',phone:'010-8888-9999',teacher:'t1',plan:'1개월',total:8,used:8,start:d(-35),end:d(-4),hold:false,holdDays:0,log:[]}
    ]
  };
}
let DB=JSON.parse(localStorage.getItem(KEY)||'null')||seed();
function save(){localStorage.setItem(KEY,JSON.stringify(DB));}
let USER=null, TAB='students', Q='', FILT='all';

const $=s=>document.querySelector(s);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1700);}
function tName(id){const t=DB.teachers.find(x=>x.id===id);return t?t.name:'-';}
function remain(s){return s.total-s.used;}
function daysLeft(s){const t=new Date('2026-08-20');const e=new Date(s.end);return Math.round((e-t)/86400000);}
function statusTag(s){
  if(s.hold) return '<span class="tag hold">홀딩</span>';
  const r=remain(s), dl=daysLeft(s);
  if(r<=0||dl<0) return '<span class="tag expb">만료/소진</span>';
  if(r<=2||dl<=7) return '<span class="tag warnb">임박</span>';
  return '<span class="tag t">'+s.plan+'</span>';
}

// ── 화면 ───────────────────────────────────────────────
function render(){
  if(!USER){ return renderLogin(); }
  const app=$('#app');
  app.innerHTML = topBar() + '<div class="pad" id="body"></div>' + tabBar();
  if(TAB==='students') renderStudents();
  else if(TAB==='stats') renderStats();
}

function renderLogin(){
  $('#app').innerHTML = `
   <div class="demo-badge">● 데모 (가상 데이터) · 위시켓 #157748 포트폴리오</div>
   <div class="center">
     <div class="login-card">
       <h2>피아노 학원 수강관리</h2>
       <div class="sub">누구로 로그인할지 선택하세요 (권한이 분리됩니다)</div>
       <div class="who-pick">
         <button onclick="login('won')"><b>원장님</b><span class="mini">전체 학생·통계·엑셀 다운로드</span></button>
         <button onclick="login('t1')"><b>김선생</b><span class="mini">내 담당 학생만 보기</span></button>
         <button onclick="login('t2')"><b>이선생</b><span class="mini">내 담당 학생만 보기</span></button>
       </div>
     </div>
     <div class="mini" style="text-align:center">모바일 웹앱 · 폰/PC 모두 사용 · 서버 없이 소스 그대로 이전 가능</div>
   </div>`;
}
function login(who){ USER = who==='won'?{role:'won',name:'원장'}:{role:'teacher',id:who,name:tName(who)}; TAB='students'; render(); }
function logout(){ USER=null; render(); }

function topBar(){
  const label = USER.role==='won'?'원장 (전체 권한)':USER.name+' (담당 학생만)';
  return `<div class="top"><div><h1>수강관리</h1><div class="who">로그인: <b>${label}</b></div></div>
    <button class="btn ghost sm" onclick="logout()">로그아웃</button></div>`;
}
function tabBar(){
  const t=(id,ic,l)=>`<button class="${TAB===id?'on':''}" onclick="go('${id}')"><span class="ic">${ic}</span>${l}</button>`;
  let b = t('students','👨‍🎓','수강생');
  if(USER.role==='won') b += t('stats','📊','현황·엑셀');
  return `<div class="tabbar">${b}</div>`;
}
function go(t){TAB=t;render();}

function visibleStudents(){
  let list = DB.students;
  if(USER.role==='teacher') list = list.filter(s=>s.teacher===USER.id); // 권한 분리: 강사는 본인 담당만
  if(Q) list = list.filter(s=>s.name.includes(Q)||s.phone.includes(Q));
  return list;
}
function isActive(s){return !s.hold && remain(s)>0 && daysLeft(s)>=0;}
function isExpired(s){return remain(s)<=0 || daysLeft(s)<0;}
function renderStudents(){
  let base=visibleStudents();
  const cAll=base.length, cAct=base.filter(isActive).length, cExp=base.filter(isExpired).length;
  let list=base;
  if(FILT==='active') list=base.filter(isActive);
  else if(FILT==='expired') list=base.filter(isExpired);
  const tab=(id,l,n)=>`<button class="ftab ${FILT===id?'on':''}" onclick="FILT='${id}';renderStudents()">${l} (${n})</button>`;
  let h=`<div class="hello">${USER.name}님, 오늘도 좋은 하루 되세요 🎹<div class="mini">2026년 8월 20일 (수) · ${USER.role==='won'?'전체 관리자':'담당 학생'}</div></div>
    <div class="row between"><input class="search" style="flex:1" placeholder="학생 이름·전화 검색" value="${Q}" oninput="Q=this.value;renderStudents()"><button class="btn sm" style="margin-left:8px;white-space:nowrap" onclick="addForm()">＋ 학생 등록</button></div>
    <div class="ftabs">${tab('all','전체',cAll)}${tab('active','수강 중',cAct)}${tab('expired','만료·소진',cExp)}</div>`;
  h += list.map(cardHtml).join('') || '<div class="card sub">해당 학생이 없습니다.</div>';
  $('#body').innerHTML=h;
}
function cardHtml(s){
  const r=remain(s), pct=Math.max(0,Math.min(100,Math.round(s.used/s.total*100))), dl=daysLeft(s);
  return `<div class="card">
    <div class="row between">
      <div><span class="stu-name">${s.name}</span> ${statusTag(s)}</div>
      <div class="sub">${tName(s.teacher)}</div>
    </div>
    <div class="row between" style="margin-top:8px;align-items:flex-end">
      <div class="big">${r}<small> / ${s.total}회 남음</small></div>
      <div class="mini" style="text-align:right">시작 ${s.start}<br>만료 <b style="color:${dl<0?'var(--danger)':dl<=7?'var(--warn)':'var(--ink)'}">${s.end}</b> (D${dl>=0?'-'+dl:'+'+(-dl)})</div>
    </div>
    <div class="barwrap"><div class="bar" style="width:${pct}%;background:${r<=0?'var(--danger)':s.hold?'var(--hold)':'var(--pri)'}"></div></div>
    <div class="row" style="margin-top:12px;gap:8px">
      ${s.hold
        ? `<button class="btn hold sm" style="flex:1" onclick="unhold('${s.id}')">홀딩 해제 (만료일 복구)</button>`
        : `<button class="btn ok sm" style="flex:2" onclick="attend('${s.id}')">＋1회 수업 완료</button>
           <button class="btn warn sm" style="flex:1" onclick="hold('${s.id}')">홀딩</button>`}
      <button class="btn ghost sm" onclick="detail('${s.id}')">기록</button>
    </div>
  </div>`;
}

// ── 핵심 로직: 차감 / 취소복구 / 홀딩 만료연장 ───────────────
function attend(id){
  const s=DB.students.find(x=>x.id===id);
  if(s.hold){toast('홀딩 중에는 차감할 수 없어요');return;}
  if(remain(s)<=0){toast('잔여 회차가 없습니다');return;}
  s.used++; s.log.unshift({t:'차감',when:stamp(),by:USER.name});
  save(); toast(`${s.name} +1회 차감 (잔여 ${remain(s)})`); refresh();
}
function undo(id){ // 잘못 누른 수업 취소 → 잔여 정확 복구
  const s=DB.students.find(x=>x.id===id);
  if(s.used<=0){toast('취소할 기록이 없습니다');return;}
  s.used--; s.log.unshift({t:'취소·복구',when:stamp(),by:USER.name});
  save(); toast(`${s.name} 차감 취소 → 잔여 ${remain(s)} 복구`); detail(id);
}
function hold(id){ // 홀딩 시작
  const s=DB.students.find(x=>x.id===id); s.hold=true; s._holdStart=stamp();
  s.log.unshift({t:'홀딩 시작',when:stamp(),by:USER.name});
  save(); toast(`${s.name} 홀딩 시작 (만료일 정지)`); refresh();
}
function unhold(id){ // 홀딩 해제 → 홀딩 기간(예: 7일)만큼 만료일 자동 연장
  const s=DB.students.find(x=>x.id===id);
  const ext=s.holdDays||7;
  const e=new Date(s.end); e.setDate(e.getDate()+ext); s.end=e.toISOString().slice(0,10);
  s.hold=false; s.holdDays=0;
  s.log.unshift({t:`홀딩 해제 (+${ext}일 연장)`,when:stamp(),by:USER.name});
  save(); toast(`${s.name} 홀딩 해제 · 만료일 ${ext}일 연장 → ${s.end}`); refresh();
}
function stamp(){return '2026-08-20 '+new Date().toTimeString().slice(0,5);}
function refresh(){ if(TAB==='students')renderStudents(); else renderStats(); }

function detail(id){
  const s=DB.students.find(x=>x.id===id);
  $('#sheet').innerHTML=`
    <h3>${s.name} <span class="sub">${tName(s.teacher)} · ${s.plan}</span></h3>
    <div class="row between" style="margin:10px 0">
      <div class="big">${remain(s)}<small>/${s.total}회</small></div>
      <div class="mini" style="text-align:right">전화 ${s.phone}<br>만료 ${s.end}</div>
    </div>
    <div class="row" style="gap:8px">
      <button class="btn ok sm" style="flex:2" onclick="attend('${s.id}');detail('${s.id}')" ${s.hold?'disabled style=opacity:.4':''}>＋1회</button>
      <button class="btn danger sm" style="flex:2" onclick="undo('${s.id}')">직전 차감 취소(복구)</button>
    </div>
    <div class="mini" style="margin-top:14px;font-weight:700">최근 기록</div>
    <div class="lesson-log">${(s.log.length?s.log:[{t:'기록 없음',when:'',by:''}]).map(l=>`<div class="logline"><span>${l.t}</span><span>${l.when} ${l.by}</span></div>`).join('')}</div>
    <button class="btn ghost" style="width:100%;margin-top:14px" onclick="closeSheet()">닫기</button>`;
  $('#modalBg').classList.add('show');
}
function closeSheet(){$('#modalBg').classList.remove('show');}
$('#modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg')closeSheet();});

// 학생 등록 (수강생·수강권 등록 요구사항)
const PLANS={'1개월':8,'3개월':24,'6개월':48};
function addForm(){
  const tOpts=DB.teachers.map(t=>`<option value="${t.id}" ${USER.role==='teacher'&&USER.id===t.id?'selected':''}>${t.name}</option>`).join('');
  $('#sheet').innerHTML=`
    <h3>학생 등록 <span class="sub">수강생·수강권</span></h3>
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:12px">
      <input class="search" id="nName" placeholder="학생 이름 *">
      <input class="search" id="nPhone" placeholder="전화번호 (예: 010-0000-0000)">
      <div class="row" style="gap:8px">
        <select class="search" id="nTeacher" style="flex:1">${tOpts}</select>
        <select class="search" id="nPlan" style="flex:1"><option value="1개월">1개월(8회)</option><option value="3개월" selected>3개월(24회)</option><option value="6개월">6개월(48회)</option></select>
      </div>
      <label class="mini">시작일 <input class="search" id="nStart" type="date" value="2026-08-20"></label>
    </div>
    <div class="row" style="gap:8px;margin-top:14px">
      <button class="btn ghost sm" style="flex:1" onclick="closeSheet()">취소</button>
      <button class="btn sm" style="flex:2" onclick="saveNew()">등록하기</button>
    </div>`;
  $('#modalBg').classList.add('show');
}
function saveNew(){
  const name=$('#nName').value.trim();
  if(!name){toast('학생 이름을 입력하세요');return;}
  const plan=$('#nPlan').value, total=PLANS[plan];
  const start=$('#nStart').value||'2026-08-20';
  const months={'1개월':1,'3개월':3,'6개월':6}[plan];
  const e=new Date(start); e.setMonth(e.getMonth()+months);
  const s={id:'s'+Date.now(),name,phone:$('#nPhone').value.trim()||'-',teacher:$('#nTeacher').value,plan,total,used:0,start,end:e.toISOString().slice(0,10),hold:false,holdDays:7,log:[{t:'등록',when:stamp(),by:USER.name}]};
  DB.students.push(s); save(); closeSheet();
  toast(`${name} 등록 완료 (${plan}·${total}회)`); FILT='all'; renderStudents();
}

// ── 원장 전용: 현황 + 엑셀(CSV) 다운로드 ───────────────
function renderStats(){
  const all=DB.students;
  const active=all.filter(s=>!s.hold&&remain(s)>0&&daysLeft(s)>=0).length;
  const soon=all.filter(s=>!s.hold&&(remain(s)<=2||(daysLeft(s)>=0&&daysLeft(s)<=7))).length;
  const holding=all.filter(s=>s.hold).length;
  const byT=DB.teachers.map(t=>({name:t.name,n:all.filter(s=>s.teacher===t.id).length}));
  $('#body').innerHTML=`
   <div class="grid3">
     <div class="kpi"><div class="n">${all.length}</div><div class="l">전체 수강생</div></div>
     <div class="kpi"><div class="n" style="color:var(--warn)">${soon}</div><div class="l">만료·소진 임박</div></div>
     <div class="kpi"><div class="n" style="color:var(--hold)">${holding}</div><div class="l">홀딩 중</div></div>
   </div>
   <div class="card"><div class="row between"><b>강사별 담당</b><span class="mini">권한 분리</span></div>
     ${byT.map(t=>`<div class="row between" style="margin-top:8px"><span>${t.name}</span><b>${t.n}명</b></div>`).join('')}</div>
   <div class="card"><b>만료·소진 임박 (관리 필요)</b>
     ${all.filter(s=>!s.hold&&(remain(s)<=2||(daysLeft(s)>=0&&daysLeft(s)<=7))).map(s=>`<div class="row between" style="margin-top:8px"><span>${s.name} <span class="mini">${tName(s.teacher)}</span></span><span class="mini">잔여 ${remain(s)}회 · 만료 ${s.end}</span></div>`).join('')||'<div class="mini" style="margin-top:6px">없음</div>'}</div>
   <button class="btn" style="width:100%" onclick="exportCSV()">📥 전체 수강 현황 엑셀 다운로드</button>
   <div class="mini" style="text-align:center;margin-top:8px">데이터는 이 기기에 저장(데모). 실납품은 원장님 계정 클라우드 DB로 여러 기기 실시간 공유.</div>`;
}
function exportCSV(){
  const head=['이름','전화','담당강사','수강권','총회차','사용','잔여','시작일','만료일','상태'];
  const rows=DB.students.map(s=>[s.name,s.phone,tName(s.teacher),s.plan,s.total,s.used,remain(s),s.start,s.end,s.hold?'홀딩':(remain(s)<=0?'소진':'진행')]);
  const csv='﻿'+[head,...rows].map(r=>r.join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='수강현황_2026-08-20.csv';a.click();
  toast('엑셀(CSV) 다운로드');
}
render();
</script>
</body>
